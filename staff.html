<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>썸잇 현장 명단</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#172033;color:#fff;padding:22px 18px 16px;position:sticky;top:0;z-index:2}.top h1{margin:0 0 5px;font-size:22px}.top p{margin:0;color:#aeb8ca;font-size:13px}.wrap{max-width:820px;margin:auto;padding:14px}.dates{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.date{border:0;background:#e8edf5;color:#536178;border-radius:12px;padding:11px 15px;white-space:nowrap;font-weight:700}.date.on{background:#c9a96e;color:#172033}.summary{display:flex;gap:10px;margin-bottom:12px}.sum{background:#fff;border-radius:14px;padding:12px 14px;flex:1;box-shadow:0 2px 12px #1720330b}.sum b{display:block;font-size:21px}.sum small{color:#718096}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #1720330b}.panel h2{margin:0 0 10px;font-size:16px}.person{width:100%;text-align:left;border:1px solid #edf0f5;background:#fff;border-radius:11px;padding:13px 12px;margin:5px 0;display:flex;justify-content:space-between;align-items:center;font-size:16px}.person span{color:#758198;font-size:13px}.person.arrived{background:#edf8f1;border-color:#93d2aa;color:#257047;text-decoration:line-through}.empty{color:#9aa5b5;text-align:center;padding:24px 5px}.foot{text-align:center;color:#8b96a8;font-size:12px;padding:18px}.error{background:#fff0f0;color:#b42318;border-radius:12px;padding:14px;margin:10px 0;display:none}@media(max-width:620px){.cols{grid-template-columns:1fr}.top h1{font-size:20px}}
</style><style>.person{padding:15px 14px;font-size:18px}.person span{color:#536178;font-size:17px;font-weight:700;letter-spacing:.02em}</style></head>
<body><header class="top"><h1>썸잇 현장 명단</h1><p id="updated">명단 불러오는 중…</p></header><main class="wrap"><div id="error" class="error"></div><nav id="dates" class="dates"></nav><section id="summary" class="summary"></section><section class="cols"><article class="panel"><h2>남성 <span id="maleCount"></span></h2><div id="maleList"></div></article><article class="panel"><h2>여성 <span id="femaleCount"></span></h2><div id="femaleList"></div></article></section><div class="foot">명단은 30초마다 자동으로 새로고침됩니다 · 이름을 누르면 출석 체크됩니다</div></main>
<script>
const GAS='https://script.google.com/macros/s/AKfycbzsAYlOdww4z4MBjiEtZvPgrn6_-wUvyy98niITt8y6INKgwOJBieRNhKidLVt_GFZHQg/exec?action=getStaffRoster';let roster={},selected='';
function kstNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}))}
function currentPartyDates(){const now=kstNow(),day=now.getDay(),offset=day>=5?5-day:5-day;const fri=new Date(now);fri.setHours(0,0,0,0);fri.setDate(now.getDate()+offset);return [0,1,2].map(i=>{const d=new Date(fri);d.setDate(fri.getDate()+i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`})}
const key=()=>`sumit-attendance-${selected}`;const checked=()=>JSON.parse(localStorage.getItem(key())||'{}');
function fmt(d){const x=new Date(d+'T00:00:00+09:00');return `${x.getMonth()+1}월 ${x.getDate()}일 (${['일','월','화','수','목','금','토'][x.getDay()]})`}
function fmtPhone(phone){let p=String(phone||'').replace(/\D/g,'');if(p.length===10&&p.startsWith('10'))p='0'+p;if(p.length===11&&p.startsWith('010'))return p.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');return phone||'-'}
function render(){const d=roster[selected]||{male:[],female:[]},c=checked();document.getElementById('maleCount').textContent=`${d.male.length}명`;document.getElementById('femaleCount').textContent=`${d.female.length}명`;for(const [g,arr] of [['male',d.male],['female',d.female]]){const el=document.getElementById(g+'List');el.innerHTML=arr.length?arr.map(p=>`<button class="person ${c[p.id]?'arrived':''}" data-id="${p.id}"><b>${p.name}</b><span>${fmtPhone(p.phone)}</span></button>`).join(''):'<div class="empty">현재 명단이 없습니다</div>';el.querySelectorAll('.person').forEach(b=>b.onclick=()=>{const n=checked();n[b.dataset.id]=!n[b.dataset.id];localStorage.setItem(key(),JSON.stringify(n));render()})}document.getElementById('summary').innerHTML=`<div class="sum"><small>전체</small><b>${d.male.length+d.female.length}명</b></div><div class="sum"><small>출석 체크</small><b>${Object.values(c).filter(Boolean).length}명</b></div>`}
function drawDates(){const dates=Object.keys(roster).sort();if(!selected||!roster[selected])selected=dates[0]||'';document.getElementById('dates').innerHTML=dates.map(d=>`<button class="date ${d===selected?'on':''}" data-date="${d}">${fmt(d)}</button>`).join('');document.querySelectorAll('.date').forEach(b=>b.onclick=()=>{selected=b.dataset.date;drawDates();render()})}
async function load(){try{const r=await fetch(GAS+'&_='+Date.now());const j=await r.json();if(j.result!=='success')throw Error('명단을 불러오지 못했습니다');roster=filterCurrentWeekData(j.data||{});drawDates();render();document.getElementById('updated').textContent='한국시간 기준 마지막 업데이트 '+kstNow().toLocaleTimeString('ko-KR')}catch(e){document.getElementById('error').style.display='block';document.getElementById('error').textContent='명단을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'}}
function filterCurrentWeekData(data){const allowed=new Set(currentPartyDates());return Object.fromEntries(Object.entries(data).filter(([d])=>allowed.has(d)))}
load();setInterval(load,30000);
</script></body></html>
